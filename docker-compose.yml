# Local services only; run the app with `php artisan serve` and `npm run dev`.
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: salon_saas
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  mysql-data:
